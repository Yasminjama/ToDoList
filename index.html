<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min Todo-lista</title>

    <!--Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <h1>Min Todo-lista</h1>

      <!-- Formulär för att lägga till nya uppgifter -->
      <div class="add-todo">
        <input type="text" id="todo-input" placeholder="Lägg till ny uppgift" />
        <button id="add-btn">Lägg till</button>
      </div>

      <!-- Filter knappar -->
      <div class="filters">
        <button id="filter-all" class="active">Alla</button>
        <button id="filter-active">Aktiva</button>
        <button id="filter-completed">Klara</button>
      </div>

      <!-- Lista med todos -->
      <ul id="todo-list"></ul>

      <!-- Rensa alla knapp -->
      <button id="clear-all">Rensa alla</button>
    </div>
     
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
